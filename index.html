<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="description" content="A theme toggle webpage using CSS animations and JavaScript." />
  <title>Theme Toggle Animation</title>

  <!-- External CSS -->
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="container">
    <h1>Welcome to Animated Web</h1>
    
    <!-- Accessible button with aria-label -->
    <button id="themeToggle" aria-label="Toggle light and dark theme">Toggle Theme</button>
  </main>

  <!-- External JS -->
  <script src="script.js" defer></script>
</body>
</html>
